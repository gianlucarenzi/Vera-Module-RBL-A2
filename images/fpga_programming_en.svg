<text x="96.0" y="724" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="120.0" y="724" font-size="14" font-weight="bold" fill="#222">Stop the ESP32</text>
<text x="86.0" y="752" font-size="12" fill="#333">hold BOOT0, press and release RESET,</text>
<text x="86.0" y="770" font-size="12" fill="#333">release BOOT0 (download mode: its</text>
<text x="86.0" y="788" font-size="12" fill="#333">pins are inputs)</text>
<rect x="349.0" y="690" width="263.0" height="150" rx="10" fill="#f4f6f8" stroke="#cfd6dd"/>
<circle cx="375.0" cy="718" r="15" fill="#e23b3b" stroke="#8a1414" stroke-width="2"/>
<text x="375.0" y="724" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="399.0" y="724" font-size="14" font-weight="bold" fill="#222">Close JP2</text>
<text x="365.0" y="752" font-size="12" fill="#333">CDONE to GND: U9 selects the flash</text>
<text x="365.0" y="770" font-size="12" fill="#333">U10, U8 takes the microSD off the</text>
<text x="365.0" y="788" font-size="12" fill="#333">SPI bus</text>
<rect x="628.0" y="690" width="263.0" height="150" rx="10" fill="#f4f6f8" stroke="#cfd6dd"/>
<circle cx="654.0" cy="718" r="15" fill="#e23b3b" stroke="#8a1414" stroke-width="2"/>
<text x="654.0" y="724" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="678.0" y="724" font-size="14" font-weight="bold" fill="#222">Run iceprog</text>
<text x="644.0" y="754" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#1f3c88">iceprog -t   (ID: ef 40 15)</text>
<text x="644.0" y="776" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#1f3c88">iceprog vera_module.bin</text>
<text x="644.0" y="798" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#1f3c88">iceprog -c vera_module.bin</text>
<rect x="907.0" y="690" width="263.0" height="150" rx="10" fill="#f4f6f8" stroke="#cfd6dd"/>
<circle cx="933.0" cy="718" r="15" fill="#e23b3b" stroke="#8a1414" stroke-width="2"/>
<text x="933.0" y="724" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="957.0" y="724" font-size="14" font-weight="bold" fill="#222">Open JP2, press RESET</text>
<text x="923.0" y="752" font-size="12" fill="#333">the ESP32 pulses CRESET, the FPGA</text>
<text x="923.0" y="770" font-size="12" fill="#333">loads the bitstream, VERA READY</text>
<text x="923.0" y="788" font-size="12" fill="#333">lights up</text>
<text x="70" y="880" font-size="12" fill="#555">J6.1 is 5 V (JP1) or 3.3 V (JP3) of the board: leave it unconnected. With JP2 closed iceprog reports 'cdone: low': that is expected.</text>
